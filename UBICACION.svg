<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Degradado moderno para el icono de ubicación -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <!-- Sombra suave para dar profundidad -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="none" />
  
  <!-- Sombra elíptica en la base -->
  <ellipse cx="50" cy="90" rx="16" ry="5" fill="#000000" opacity="0.12" />
  
  <!-- Pin de ubicación -->
  <path d="M 50 15 
           C 31 15, 16 30, 16 49 
           C 16 63, 24 73, 35 83 
           L 50 95 
           L 65 83 
           C 76 73, 84 63, 84 49 
           C 84 30, 69 15, 50 15 Z" 
        fill="url(#pinGradient)" 
        filter="url(#dropShadow)" />
        
  <!-- Orificio del centro -->
  <circle cx="50" cy="46" r="14" fill="#FFFFFF" />
</svg>
