<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente para simular el fondo de Instagram -->
    <radialGradient id="instaGrad" cx="30%" cy="107%" r="130%" fx="30%" fy="107%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="5%" stop-color="#fdf497" />
      <stop offset="45%" stop-color="#fd5949" />
      <stop offset="60%" stop-color="#d6249f" />
      <stop offset="90%" stop-color="#285AEB" />
    </radialGradient>
  </defs>
  <!-- Fondo Circular -->
  <circle cx="256" cy="256" r="240" fill="url(#instaGrad)" />
  
  <!-- Sombra interna/Sombra larga estilizada opcional (diseño limpio) -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cuerpo de la cámara -->
    <rect x="136" y="136" width="240" height="240" rx="65" />
    <!-- Lente central -->
    <circle cx="256" cy="256" r="60" />
  </g>
  <!-- Flash de la cámara -->
  <circle cx="330" cy="182" r="18" fill="#ffffff" />
</svg>
